name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Any base branch, so PRs stacked on another PR get a build too.
  pull_request:
  # Manual run: also runs the Maestro E2E flows (activation-e2e.yml) on this build's APK.
  workflow_dispatch:
    inputs:
      e2e:
        description: Run the Maestro E2E flows
        type: boolean
        default: true

# A new push to a PR cancels its running build.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # Node >= 23.6 runs the TypeScript test files natively (type-stripping),
          # matching the local toolchain. No build step or extra deps required.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Check release version metadata
        run: npm run check:versions

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # Replaces actions/cache and keeps the Gradle build cache, so unchanged library modules are not
      # recompiled. Saved from PRs too (default is main only): a PR's next push starts warm instead of
      # re-resolving every dependency (~2.5 min) until main has a cache.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # Gradle's build cache never covers CMake/ninja, so the native C++ (app, reanimated, worklets,
      # screens, ...) recompiled every run (~2 min). ccache keys on preprocessed source, so unchanged
      # modules hit. Wired via CMAKE_*_COMPILER_LAUNCHER (env, read by CMake >= 3.17) in Build APK.
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-${{ runner.os }}-arm64
          max-size: 500M

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # Metro's transform cache (see metro.config.js), so only changed JS files are re-transformed
      # in the bundle step. Content-addressed inside Metro, so a restore-keys fallback is safe.
      - name: Cache Metro transforms
        uses: actions/cache@v5
        with:
          path: .metro-cache
          key: metro-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            metro-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            metro-${{ runner.os }}-

      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install

      # PR builds stamp the PR number and commit into src/lib/build-info.json so
      # the About screen can link both; main/tag builds keep the empty placeholder.
      - name: Stamp build info
        if: github.event_name == 'pull_request'
        env:
          BUILD_INFO_REPO: ${{ github.server_url }}/${{ github.repository }}
          BUILD_INFO_PR: ${{ github.event.pull_request.number }}
          BUILD_INFO_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/make-build-info.mjs

      - name: Setup signing
        # Every build (main pushes and v* tags alike) is signed with the one release keystore from the
        # repo secrets, so each APK installs over the previous one and keeps the app's data. Without
        # the secrets the build falls back to a throwaway key and warns: that APK cannot update an
        # installed build. Secrets go through env, not ${{ }} in the script text.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            {
              echo "RELEASE_STORE_FILE=release.keystore"
              echo "RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
              echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Signing: release keystore"
          else
            keytool -genkey -v -keystore android/app/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "::warning title=Throwaway signing key::KEYSTORE_BASE64 is not set, so this APK is signed with a one-off key and will not install over an earlier build. See issue #1."
          fi

      - name: Check release signing
        if: env.RELEASE_STORE_FILE != ''
        run: keytool -list -keystore android/app/release.keystore -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" > /dev/null

      - name: Build APK
        working-directory: android
        # arm64-v8a: every current phone. x86_64 too on manual E2E runs, so the E2E job can install
        # this same APK on its x86_64 emulator instead of building its own (the default list also
        # compiles armeabi-v7a and x86). More heap/metaspace than gradle.properties
        # (2 GiB / 512 MiB), where the daemon ran out of metaspace and restarted mid-build.
        # lintVital runs in the lint job, in parallel; skipping it here saves 1-3 min.
        env:
          ABIS: ${{ inputs.e2e && 'arm64-v8a,x86_64' || 'arm64-v8a' }}
          METRO_CACHE_DIR: ${{ github.workspace }}/.metro-cache
          # optimizeReleaseResources (~23s) only shrinks the APK a little. Skipped on PR / manual
          # builds; main and v* tag builds keep it, so what ships stays fully optimized.
          FAST_FLAGS: ${{ (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && '-Pandroid.enableResourceOptimizations=false' || '' }}
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          # The NDK is reinstalled every run, so its mtime changes; ccache's default compiler check
          # (mtime) then missed on every compile (0/191 hits). The NDK version is pinned, so key on that.
          CCACHE_COMPILERCHECK: string:ndk-27.1.12297006
        run: >-
          ./gradlew assembleRelease
          --build-cache
          -x lintVitalRelease
          -PreactNativeArchitectures=$ABIS
          $FAST_FLAGS
          "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk

  # Release lint (lintVital: fatal issues only), split off the build job so it runs alongside it.
  lint:
    # Not on release tags: the release job needs only `build`, and the same commit already linted on main/PR.
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install

      - name: Lint
        working-directory: android
        run: >-
          ./gradlew lintVitalRelease
          --build-cache
          -PreactNativeArchitectures=arm64-v8a
          "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"

  # Manual runs only (emulator run is slow). Runs on the APK built above; no second Gradle build.
  e2e:
    needs: [build]
    if: inputs.e2e
    uses: ./.github/workflows/activation-e2e.yml
    with:
      apk-artifact: app-release

  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: app-release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: app-release.apk
          generate_release_notes: true
